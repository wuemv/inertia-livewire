name: CI

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Inertia ${{ matrix.inertia }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        inertia: ['3']
        include:
          - { php: '8.3', laravel: '12', inertia: '2' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: >
          composer require --no-update --no-interaction
          "illuminate/support:^${{ matrix.laravel }}.0"
          "inertiajs/inertia-laravel:^${{ matrix.inertia }}.0"
      - run: composer update --no-interaction --no-progress --with-all-dependencies
      - run: vendor/bin/pest

  lint:
    name: Pun (format, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The Composer shim downloads Pun's binary on its first run; with a
      # signed-in gh it also verifies the binary's GitHub build attestation.
      GH_TOKEN: ${{ github.token }}
      PUN_REQUIRE_ATTESTATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/pun format --test
      - run: vendor/bin/pun lint

  js:
    name: JavaScript (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser (real Livewire, Vue, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: composer update --no-interaction --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - name: Laravel's log
        if: failure()
        run: cat vendor/orchestra/testbench-core/laravel/storage/logs/*.log || true
